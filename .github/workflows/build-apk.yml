herename: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npx @capacitor/assets generate --android

      - name: App links and version
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          f = '<intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="https" android:host="limoai-collab.github.io" android:pathPrefix="/Limo-ai-/" /></intent-filter></activity>'
          assert '</activity>' in s
          s = s.replace('</activity>', f, 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -i 's/versionCode 1/versionCode 2/; s/versionName "1.0"/versionName "2.0"/' android/app/build.gradle

      - name: Keep content below status bar
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/res/values/styles.xml'
          s = open(p, encoding='utf-8').read()
          items = '<item name="android:windowOptOutEdgeToEdgeEnforcement">true</item><item name="android:statusBarColor">#0f1222</item><item name="android:navigationBarColor">#0f1222</item>'
          n = 0
          for name in ('AppTheme.NoActionBar', 'AppTheme.NoActionBarLaunch'):
              pat = re.compile(r'(<style\s+name="' + re.escape(name) + r'"[^>]*>)')
              s, c = pat.subn(lambda m: m.group(1) + items, s, count=1)
              n += c
          assert n >= 1
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/limo.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/limo.keystore" --ks-key-alias limo --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Limo-native.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Limo-native-apk
          path: Limo-native.apk
